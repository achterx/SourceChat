name: Build SourceChat (Win32)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32 Release
        run: |
          msbuild SourceChat.vcxproj /p:Configuration=Release /p:Platform=Win32 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcechat-win32
          path: Release/sourcechat.dll
